<style>
:root{--p:rgba(37,99,235,.06);--b:rgba(37,99,235,.2);--r:#2563eb;--r2:#dc2626;--m:#64748b;--g:#16a34a;--y:#d97706}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:#eef0f3;color:#1f2937;display:flex;font-size:14px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background:radial-gradient(circle at 82% 12%,rgba(37,99,235,.18),transparent 23%),radial-gradient(circle at 14% 88%,rgba(37,99,235,.12),transparent 25%)}
.hidden{display:none!important}
#side{width:256px;flex:none;background:#0a192f;color:#fff;box-shadow:20px 0 50px rgba(0,0,0,.18);display:flex;flex-direction:column;padding:18px 14px;height:100vh;position:sticky;top:0;z-index:5}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 20px;border-bottom:1px solid rgba(255,62,62,.2);margin-bottom:16px}.brand img{width:40px;height:40px;object-fit:contain}
.brand b{font-weight:900;letter-spacing:.06em;font-size:15px;display:block;color:#fff}.brand small{font-size:9px;letter-spacing:.22em;color:#ff3e3e;font-weight:900;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:12px;padding:.85rem 1rem;border-radius:.75rem;color:rgba(255,255,255,.6);text-transform:uppercase;font-weight:800;font-size:.78rem;cursor:pointer;border:2px solid transparent;margin-bottom:.45rem;transition:all .2s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}.nav.on{background:rgba(255,62,62,.2);border-color:#ff3e3e;color:#ff8080;box-shadow:0 0 28px rgba(255,62,62,.3)}

const rateExp=n=>{AU(TD.id,{feedback:{stars:n,at:Date.now()}});toast('Thank you for your feedback!')};
function editMe(){const d=TD;modal(`<h2>Update my details</h2><p class="mut" style="margin-bottom:12px">You have the right to correct your information (POPIA).</p><label class="f">Phone / WhatsApp<input id="eP" value="${E(d.phone||'')}"></label><label class="f">Key skills<input id="eS" value="${E((d.skills||[]).join(', '))}"></label><label class="f">Cover note<textarea id="eM" rows="3">${E(d.note||'')}</textarea></label><div class="row"><button class="btn gh" onclick="closeM()">Cancel</button><button class="btn" onclick="saveMe()">Save</button></div>`)}
async function saveMe(){const d=TD,p=$('eP').value.trim(),sk=$('eS').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20),nt=$('eM').value.trim(),v=V.find(x=>x.id===d.vacancyId),mm=v&&match(v,sk.join(' ')+' '+nt),o={phone:p,contact:[d.email,p].join(' / '),skills:sk,note:nt,msgs:FV().arrayUnion({f:'cand',t:'I updated my details.',at:Date.now(),sys:1}),unreadHR:true};if(mm)o.match={score:mm.score,hit:mm.hit,miss:mm.miss};await AU(d.id,o);closeM();toast('Details updated')}
function offerResp(r){if(!confirm(r+' this offer?'))return;const n=Date.now();AU(TD.id,{'offer.response':r,'offer.respondedAt':n,history:FV().arrayUnion({s:'Offer '+r.toLowerCase(),at:n}),unreadHR:true})}
async function myData(id){const s=await db.collection('applications').doc(id).get(),d=s.data();
 modal(`<h2>Your information on file (POPIA s23)</h2><p class="mut" style="line-height:1.8">Name: ${E(d.name)}<br>Email: ${E(d.email)}<br>Phone: ${E(d.phone)}<br>Position: ${E(d.position)}<br>CV: ${E(d.cvName||'none')}<br>Consent given: ${fd(d.consent&&d.consent.at)} (policy ${E(d.consent&&d.consent.version)})<br>Keep until: ${fd(d.retainUntil)}</p><button class="btn gh" style="margin-top:14px" onclick="closeM()">Close</button>`)}
async function reqDel(id){if(!confirm('Request deletion of your application and CV? HR will process this and confirm.'))return;
 try{await db.collection('applications').doc(id).update({deletionRequested:true,deletionRequestedAt:Date.now()});toast('Deletion request sent.');doTrack()}catch(e){toast('Could not send. Email '+INFO_OFFICER)}}

/* ---------- privacy ---------- */
function privBody(){return `<div class="grid" style="gap:10px">${[
['Who we are','24 Solutions (Responsible Party) processes your information to run its recruitment. Information Officer: <a href="mailto:'+INFO_OFFICER+'">'+INFO_OFFICER+'</a>.'],
['What we collect','Name, email, phone, cover note and CV — only what is needed to assess you. We do not ask for ID numbers, race, health or other special personal information at application stage.'],
['Why','To assess your suitability, contact you, schedule interviews and, if hired, start onboarding. We do not sell your data or use it for marketing.'],
['Who sees it','Authorised HR / IT personnel only, after secure sign-in. CVs are stored in access-controlled cloud storage (Google Firebase).'],
['How long',''+RETENTION_MONTHS+' months after application, or 24 months if you opted in to the talent pool. Hired candidates move to employee records.'],
['Your rights','Access, correct, object, withdraw consent or request deletion at any time (use Track Application, or email the Information Officer). You may complain to the Information Regulator: inforeg.org.za.']
].map(([t,b])=>`<div class="card"><div class="lbl">${t}</div><p class="mut" style="margin-top:6px;line-height:1.6">${b}</p></div>`).join('')}</div>`}
const vPriv=()=>hdr('Privacy Notice (POPIA)','How 24 Solutions protects your personal information.')+privBody();
const privM=()=>modal(`<h2>Privacy Notice</h2>${privBody()}<button class="btn gh" style="margin-top:14px" onclick="closeM()">Close</button>`,1);

init();
</script></body></html>
